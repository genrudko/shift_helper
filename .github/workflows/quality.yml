name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node for frontend syntax check
        if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Verify vendored frontend assets
        if: runner.os == 'Linux'
        shell: bash
        run: sha256sum -c src/shift_helper/static/vendor/tabulator/SHA256SUMS

      - name: Check journal JavaScript syntax
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node --check src/shift_helper/static/event_journal.js
          node --check src/shift_helper/static/event_journal_lifecycle_guard.js
          node --check src/shift_helper/static/event_journal_history_v6.js
          node --check src/shift_helper/static/event_journal_safe_redraw.js
          node --check src/shift_helper/static/event_journal_workspace_v4.js
          node --check src/shift_helper/static/event_journal_viewport_v5.js
          node --check src/shift_helper/static/event_journal_editor_caret_v5.js
          node --check src/shift_helper/static/event_journal_frozen_columns_v5.js

      - name: Ruff
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m ruff check . 2>&1 | tee ruff-report.txt

      - name: Upload Ruff diagnostics
        if: steps.ruff.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report-${{ runner.os }}
          path: ruff-report.txt
          if-no-files-found: error

      - name: Stop after Ruff failure
        if: steps.ruff.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Pytest
        run: python -m pytest
