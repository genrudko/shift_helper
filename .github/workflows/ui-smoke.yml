name: ui-smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application and Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Start isolated Shift-Helper instance
        shell: bash
        run: |
          set -Eeuo pipefail
          data_root="$RUNNER_TEMP/shift-helper-ui-data"
          python -c "from pathlib import Path; from waitress import serve; from shift_helper import create_app; serve(create_app(data_root=Path(r'$data_root')), host='127.0.0.1', port=17944, threads=4)" \
            >ui-server.out.log 2>ui-server.err.log &
          echo "$!" > ui-server.pid
          python scripts/wait_for_health.py 17944

      - name: Exercise spreadsheet in Chromium
        shell: bash
        run: |
          set -o pipefail
          python scripts/ui_smoke_acceptance_stage1.py \
            http://127.0.0.1:17944 ui-stage1-failure.png \
            2>&1 | tee ui-smoke.log
          python scripts/ui_smoke_acceptance_stage2.py \
            http://127.0.0.1:17944 ui-stage2-failure.png \
            2>&1 | tee -a ui-smoke.log
          python scripts/ui_smoke_entry_stage1.py \
            http://127.0.0.1:17944 ui-smoke-failure.png \
            2>&1 | tee -a ui-smoke.log
          python scripts/ui_smoke_video_regression.py \
            http://127.0.0.1:17944 ui-video-regression-failure.png \
            2>&1 | tee -a ui-smoke.log

      - name: Stop isolated instance
        if: always()
        shell: bash
        run: |
          if [[ -f ui-server.pid ]]; then
            kill "$(cat ui-server.pid)" 2>/dev/null || true
          fi

      - name: Upload UI diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spreadsheet-ui-smoke-diagnostics
          path: |
            ui-server.*.log
            ui-smoke.log
            ui-smoke-failure.png
            ui-video-regression-failure.png
            ui-stage1-failure.png
            ui-stage2-failure.png
          if-no-files-found: ignore
