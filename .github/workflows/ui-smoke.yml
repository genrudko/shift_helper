name: ui-smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application and Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Start isolated Shift-Helper instance
        shell: bash
        run: |
          set -Eeuo pipefail
          data_root="$RUNNER_TEMP/shift-helper-ui-data"
          python -c "from pathlib import Path; from waitress import serve; from shift_helper import create_app; serve(create_app(data_root=Path(r'$data_root')), host='127.0.0.1', port=17944, threads=4)" \
            >ui-server.out.log 2>ui-server.err.log &
          echo "$!" > ui-server.pid
          python scripts/wait_for_health.py 17944

      - name: Exercise spreadsheet in Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          : > ui-smoke.log

          run_stage() {
            local label="$1"
            local script="$2"
            local screenshot="$3"
            echo "===== ${label} =====" | tee -a ui-smoke.log
            timeout --signal=TERM --kill-after=10s 180s \
              python "$script" http://127.0.0.1:17944 "$screenshot" \
              2>&1 | tee -a ui-smoke.log
          }

          run_stage "acceptance-stage-1" scripts/ui_smoke_acceptance_stage1.py ui-stage1-failure.png
          run_stage "acceptance-stage-2" scripts/ui_smoke_acceptance_stage2.py ui-stage2-failure.png
          run_stage "acceptance-stage-3" scripts/ui_smoke_acceptance_stage3.py ui-stage3-failure.png
          run_stage "acceptance-stage-4" scripts/ui_smoke_acceptance_stage4.py ui-stage4-failure.png
          run_stage "acceptance-stage-5" scripts/ui_smoke_acceptance_stage5.py ui-stage5-failure.png
          run_stage "acceptance-stage-6" scripts/ui_smoke_acceptance_stage6.py ui-stage6-failure.png
          run_stage "acceptance-stage-7" scripts/ui_smoke_acceptance_stage7.py ui-stage7-failure.png
          run_stage "acceptance-stage-8" scripts/ui_smoke_acceptance_stage8.py ui-stage8-failure.png
          run_stage "full-ui-smoke" scripts/ui_smoke_entry_stage1.py ui-smoke-failure.png
          run_stage "operator-video-regression" scripts/ui_smoke_video_regression.py ui-video-regression-failure.png
          run_stage "manual-rejection-regression" scripts/ui_smoke_manual_rejection.py ui-manual-rejection-failure.png

      - name: Stop isolated instance
        if: always()
        shell: bash
        run: |
          if [[ -f ui-server.pid ]]; then
            kill "$(cat ui-server.pid)" 2>/dev/null || true
          fi

      - name: Upload UI diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spreadsheet-ui-smoke-diagnostics
          path: |
            ui-server.*.log
            ui-smoke.log
            ui-smoke-failure.png
            ui-video-regression-failure.png
            ui-manual-rejection-failure.png
            ui-stage1-failure.png
            ui-stage2-failure.png
            ui-stage3-failure.png
            ui-stage4-failure.png
            ui-stage5-failure.png
            ui-stage6-failure.png
            ui-stage7-failure.png
            ui-stage8-failure.png
          if-no-files-found: ignore
