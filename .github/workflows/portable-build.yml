name: portable-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[build]"

      - name: Build portable Windows folder
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onedir
          --name Shift-Helper
          --collect-all shift_helper
          packaging/shift_helper_entry.py

      - name: Smoke-test packaged Windows executable
        shell: pwsh
        run: .\dist\Shift-Helper\Shift-Helper.exe --help

      - name: Package Windows folder
        shell: pwsh
        run: Compress-Archive -Path ".\dist\Shift-Helper\*" -DestinationPath ".\Shift-Helper-windows-x64.zip" -Force

      - name: Upload Windows portable build
        uses: actions/upload-artifact@v4
        with:
          name: Shift-Helper-windows-x64
          path: Shift-Helper-windows-x64.zip
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[build]"

      - name: Build portable Linux folder
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onedir
          --name Shift-Helper
          --collect-all shift_helper
          packaging/shift_helper_entry.py

      - name: Smoke-test packaged Linux executable
        shell: bash
        run: ./dist/Shift-Helper/Shift-Helper --help

      - name: Package Linux folder
        run: tar -czf Shift-Helper-linux-x64.tar.gz -C dist Shift-Helper

      - name: Upload Linux portable build
        uses: actions/upload-artifact@v4
        with:
          name: Shift-Helper-linux-x64
          path: Shift-Helper-linux-x64.tar.gz
          if-no-files-found: error

  build-calc-extension:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build deterministic Calc extension
        shell: bash
        run: PYTHONPATH=src python scripts/build_calc_extension.py

      - name: Verify Calc extension
        shell: bash
        run: >-
          PYTHONPATH=src python -c
          "from pathlib import Path;
          from shift_helper.extension_builder import verify_calc_extension;
          print(verify_calc_extension(Path('dist/Shift-Helper-Calc-UNO-001.oxt')))"

      - name: Upload Calc extension
        uses: actions/upload-artifact@v4
        with:
          name: Shift-Helper-Calc-UNO-001
          path: dist/Shift-Helper-Calc-UNO-001.oxt
          if-no-files-found: error
