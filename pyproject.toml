[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shift-helper"
version = "0.4.0.dev0"
description = "Integrated Calc journal automation and full morning report test candidate"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "Flask>=3.1,<4",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "openpyxl>=3.1,<4",
    "platformdirs>=4.3,<5",
    "waitress>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]
build = [
    "pyinstaller>=6.12,<7",
]

[project.scripts]
shift-helper = "shift_helper.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shift_helper = [
    "templates/**/*.html",
    "static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"packaging/libreoffice_extension/Scripts/python/shift_helper_report.py" = ["E501"]
# This compatibility bridge is deliberately dense because it is embedded in the
# LibreOffice extension and mirrors the accepted report coordinate contract.
"src/shift_helper/core/exact_report_contract.py" = ["E501", "F401"]
